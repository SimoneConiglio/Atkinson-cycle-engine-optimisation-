[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "exlink-opt"
version = "1.0.0"
description = "Multi-objective optimization of an EX-link Atkinson-cycle engine mechanism, with GEMSEO"
readme = "README.md"
license = { text = "MIT" }
# Upper bound mirrors GEMSEO, which caps itself at <3.14; without it a user on
# 3.14 gets an opaque resolution failure from a dependency instead of a clear
# message from this package.
requires-python = ">=3.10,<3.14"
authors = [{ name = "Simone Coniglio", email = "simone.coniglio91@gmail.com" }]
keywords = [
    "optimization",
    "gemseo",
    "mdo",
    "atkinson-cycle",
    "engine",
    "mechanism",
    "kinematics",
    "pareto",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "gemseo>=6.0,<7",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# NSGA-II and friends, for the multi-objective runs.
moea = ["gemseo-pymoo>=2.0"]
# The Benders formulation and the bi-level outer-approximation master, for the
# mixed-integer gear choice in ``exlink.minlp``.
minlp = ["gemseo-bilevel-outer-approximation>=0.1"]
# Sampling and Taylor-polynomial uncertainty estimators, for the reliability
# reference in ``exlink.robustness``.
uq = ["gemseo-umdo>=4.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.8",
]
docs = [
    "sphinx>=7.2",
    "furo>=2024.1",
    "sphinx-autodoc-typehints>=2.0",
    "myst-parser>=2.0",
]
all = ["exlink-opt[moea,minlp,uq,dev,docs]"]

[project.urls]
Homepage = "https://github.com/SimoneConiglio/Atkinson-cycle-engine-optimisation-"
Repository = "https://github.com/SimoneConiglio/Atkinson-cycle-engine-optimisation-"

[project.scripts]
exlink = "exlink.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exlink"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: runs an optimizer; deselect with -m 'not slow'",
    "moea: needs the gemseo-pymoo plugin",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 96
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E741",   # the inter-axle distance is called ``I``
    "N803",   # ditto for function arguments
    "N806",   # and local names follow the symbols of the derivation
    "N815",   # and for dataclass fields such as ``theta_T``
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["exlink"]
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src/exlink"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
