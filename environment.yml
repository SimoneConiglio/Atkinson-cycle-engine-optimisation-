# Conda environment for the EX-link optimization study.
#
#   conda env create -f environment.yml
#   conda activate exlink
#   pip install -e ".[dev]"     # the project itself, in editable mode
#
# GEMSEO and gemseo-pymoo are installed with pip because they are not on
# conda-forge; everything they compile against comes from conda.
name: exlink
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.10
  - matplotlib-base>=3.7
  - pillow            # GIF writer for the animation
  - ffmpeg            # MP4 writer for the animation
  - pytest>=7.4
  - pytest-cov>=4.1
  - pip
  - pip:
      - gemseo>=6.0,<7
      - gemseo-pymoo>=2.0
      - ruff>=0.5
      - mypy>=1.8
