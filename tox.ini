[tox]
env_list = py310, py311, py312, lint, type
isolated_build = True
skip_missing_interpreters = True

[testenv]
description = run the test suite
extras = dev, moea
setenv =
    MPLBACKEND = Agg
commands =
    pytest {posargs:-m "not slow"}

[testenv:full]
description = run the whole suite, optimizers included (slow)
extras = dev, moea
setenv =
    MPLBACKEND = Agg
commands =
    pytest --cov --cov-report=term-missing {posargs}

[testenv:lint]
description = style and import order
extras = dev
skip_install = true
deps = ruff>=0.5
commands =
    ruff check src tests examples
    ruff format --check src tests examples

[testenv:type]
description = static types
extras = dev
commands =
    mypy src/exlink

[testenv:docs]
description = build the HTML docs
extras = docs
commands =
    sphinx-build -b html docs docs/_build/html

[testenv:demo]
description = regenerate the figures and the animation in figures/
extras = moea
setenv =
    MPLBACKEND = Agg
commands =
    exlink plot -o figures
    exlink animate -o figures/exlink.gif --frames 120
