name: Documentation

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Never cancel a deployment half-way; queue it instead.
  group: pages
  cancel-in-progress: false

env:
  MPLBACKEND: Agg

permissions:
  contents: read

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.11
      # The API pages are generated by autodoc, so the package and every
      # optional extra it documents have to be importable.
      - run: uv pip install -e ".[docs,moea,minlp,uq]"
      # Nitpicky mode (-n) is deliberately off: it flags every numpy and typing
      # name as unresolved, which is a property of how heavily typed this code
      # is rather than a documentation defect.
      # A broken cross-reference or a missing figure should fail the build
      # rather than ship quietly, so warnings are treated as errors -- but not
      # with -W, because intersphinx fetches its inventories over the network
      # and a transient failure there is not a documentation defect.  The log is
      # filtered instead, and anything left is fatal.
      - name: Build
        run: |
          set -o pipefail
          .venv/bin/sphinx-build -b html docs docs/_build/html 2>&1 | tee build.log
          # Sphinx's own diagnostics are "WARNING: ...".  Everything else that
          # says "warning" is a dependency's deprecation notice or the myst
          # config dump, neither of which is ours to fix here.
          if grep "WARNING: " build.log \
             | grep -v "RemovedInSphinx" \
             | grep -v "inventories" \
             | grep -v "intersphinx" > offending.log; then
            echo "::error::sphinx emitted warnings:"
            cat offending.log
            exit 1
          fi
      # GitHub Pages does not run Jekyll here, but Sphinx writes _static and
      # _images, and a stray Jekyll would drop both.
      - run: touch docs/_build/html/.nojekyll
      - name: Check every page rendered
        run: |
          for page in index introduction state_of_the_art methodology framework \
                      use_case results conclusions implementation api theory; do
            test -f "docs/_build/html/$page.html" || {
              echo "::error::$page.html was not produced"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: publish to GitHub Pages
    # Only the default branch publishes; a pull request builds but does not
    # deploy, so a broken docs change is caught before it reaches the site.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
