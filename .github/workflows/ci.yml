name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

# Every job installs into a uv-managed virtualenv rather than with
# `uv pip install --system`. The runner's system interpreter is PEP 668
# externally-managed, so `--system` is refused outright; it would also have
# ignored the matrix version and tested one Python three times.
jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create a virtualenv on Python ${{ matrix.python-version }}
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install the project
        run: uv pip install -e ".[dev,moea,minlp]"

      - name: Run the fast tests
        run: .venv/bin/pytest -m "not slow" --cov --cov-report=term-missing

  slow:
    name: optimizer tests
    runs-on: ubuntu-latest
    # These run real optimizers to convergence: every iteration of the coupled
    # problem is a converged MDA plus a coupled Jacobian, so the job is minutes,
    # not seconds. The limit is here so a hang fails fast rather than sitting for
    # the default six hours -- it is not a performance target.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev,moea,minlp]"
      - name: Run the optimizer tests
        run: .venv/bin/pytest -m slow

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev,moea,minlp]"
      - run: .venv/bin/ruff check src tests examples
      - run: .venv/bin/ruff format --check src tests examples
      - run: .venv/bin/mypy src/exlink

  package:
    name: build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build the sdist and wheel
        run: uv build --out-dir dist
      - name: Install the wheel into a clean environment
        run: |
          uv venv --python 3.11 /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
      - name: Check the console script runs without the source tree
        run: cd /tmp && /tmp/wheel-env/bin/exlink analyse --samples 360
